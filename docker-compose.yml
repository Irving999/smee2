services:
  smee2:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "5000:5000"

  prometheus:
      image: prom/prometheus
      volumes:
        - ./prometheus.yml:/etc/prometheus/prometheus.yml
      command: 
        - '--config.file=/etc/prometheus/prometheus.yml'
      ports:
        - "9090:9090"